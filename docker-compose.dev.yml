# 开发环境 compose 文件
# PostgreSQL + Redis + 后端(air 热重载) + 前端(Vite HMR)
#
# 启动：
#   docker compose -f docker-compose.dev.yml up -d --build
# 日志：
#   docker compose -f docker-compose.dev.yml logs -f
# 停止：
#   docker compose -f docker-compose.dev.yml down
# 重启单个服务：
#   docker compose -f docker-compose.dev.yml restart backend
#
# 数据目录位于 .local/（已被 .gitignore 和 .dockerignore 忽略）

name: open-ai-canvas-dev

services:
  # ── 数据库 ──────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_ai_canvas_dev}
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── 缓存 / 协调（PostgreSQL 模式必需）─────────────────────
  redis:
    image: redis:7.4-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - ./.local/redis-data:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── 后端（air 热重载，修改 .go 文件自动重新编译并重启）─────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    working_dir: /workspace/backend
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      CANVAS_BACKEND_ADDR: ':8080'
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      GIN_MODE: debug
    volumes:
      - type: bind
        source: .
        target: /workspace
      # 后端文件存储（上传的素材等）
      - type: bind
        source: ./.local/backend-data
        target: /data
        bind:
          create_host_path: true
      # 持久化 Go 编译缓存，容器重建后继续复用
      - type: bind
        source: ./.local/cache/go-build
        target: /tmp/go-build
        bind:
          create_host_path: true
      - type: bind
        source: ./.local/cache/go-mod
        target: /tmp/go-mod
        bind:
          create_host_path: true
    ports:
      - '127.0.0.1:${CANVAS_BACKEND_HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  # ── 前端（Vite HMR，修改前端文件浏览器实时刷新）──────────
  web:
    image: oven/bun:1.3.13
    working_dir: /workspace/web
    command: ['sh', '-c', 'bun install --frozen-lockfile && bun run dev']
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - web-node-modules:/workspace/web/node_modules
      - web-bun-cache:/root/.bun/install/cache
    ports:
      - '${CANVAS_HTTP_PORT:-3000}:3000'
    depends_on:
      - backend
    init: true

volumes:
  web-node-modules:
  web-bun-cache:
