services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_ai_canvas_dev}
    volumes:
      - type: bind
        source: ${CANVAS_POSTGRES_DATA_PATH:-./data/postgres-data}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - type: bind
        source: ${CANVAS_REDIS_DATA_PATH:-./data/redis-data}
        target: /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    environment:
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-open_ai_canvas}:${POSTGRES_PASSWORD:-open_ai_canvas_dev}@postgres:5432/${POSTGRES_DB:-open_ai_canvas}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CANVAS_AUTO_MIGRATE: ${CANVAS_AUTO_MIGRATE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
